<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Creations</title>
    <meta name="description" content="Your Crimson Creations project request was sent successfully.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=16">
</head>

<body class="success-page">
    <main class="success-scene" aria-labelledby="success-title">
        <div class="success-content">
            <p class="section-eyebrow">Request received</p>
            <div class="success-mark" aria-hidden="true"><i class="fa-solid fa-check"></i></div>
            <h1 id="success-title">Your project details are on their way.</h1>
            <p>Thanks for reaching out to Crimson Creations. I will review your request and follow up with the next steps.</p>
            <a class="btn btn-primary" href="/">Return home</a>
            <p class="success-countdown" aria-live="polite">Returning home in <strong id="success-countdown">2</strong> seconds.</p>
        </div>
    </main>

    <script src="success.js"></script>
</body>

</html>
