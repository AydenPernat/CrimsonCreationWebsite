<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <meta name="description" content="Your Crimson Creations project request was sent successfully.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="success-page">
    <main class="success-scene" aria-labelledby="success-title">
        <div class="success-content">
            <p class="section-eyebrow">Request received</p>
            <div class="success-mark" aria-hidden="true"><i class="fa-solid fa-check"></i></div>
            <h1 id="success-title">Your project details are on their way.</h1>
            <p>Thanks for reaching out to Crimson Creations. I will review your request and follow up with the next steps.</p>
            <a class="btn btn-primary" href="index.html">Return home</a>
            <p class="success-countdown">Returning home in <strong id="success-countdown">6</strong> seconds.</p>
        </div>
    </main>

    <script>
        const countdown = document.getElementById('success-countdown');
        let secondsLeft = 6;
        const timer = window.setInterval(() => {
            secondsLeft -= 1;
            if (countdown) countdown.textContent = String(secondsLeft);
            if (secondsLeft <= 0) {
                window.clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>

</html>
