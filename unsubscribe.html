<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Creations</title>
    <meta name="description" content="Remove your Crimson Creations newsletter subscription.">
    <link rel="stylesheet" href="style.css?v=17">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="unsubscribe-page">
    <header class="site-header">
        <a class="brand" href="/"><span class="brand-mark"><img src="img/crimson-logo.jpg" alt=""></span><span>Crimson</span> Creations</a>
    </header>

    <main class="page-shell">
        <section class="section card-section">
            <div class="portal-layout">
                <div class="portal-card reveal-on-scroll">
                    <p class="eyebrow">Newsletter management</p>
                    <h1 class="section-title unsubscribe-title">Remove your email from the newsletter.</h1>
                    <p id="unsubscribe-intro">Enter the email address that receives the newsletter. If it is subscribed, we will send a removal link to that address.</p>
                    <form class="portal-form" id="unsubscribe-link-form" hidden>
                        <button class="btn btn-primary" id="unsubscribe-link-submit" type="submit">Unsubscribe from emails</button>
                        <p class="portal-status" id="unsubscribe-link-status" aria-live="polite"></p>
                    </form>
                    <form class="portal-form" id="unsubscribe-form" autocomplete="off">
                        <div class="field">
                            <label for="unsubscribe-email">Email</label>
                            <input id="unsubscribe-email" type="email" autocomplete="email" placeholder="you@example.com" required>
                        </div>
                        <button class="btn btn-primary" id="unsubscribe-submit" type="submit">Send removal link</button>
                        <p class="portal-status" id="unsubscribe-status" aria-live="polite">Only an address currently on the newsletter list will receive a link.</p>
                    </form>
                    <p><a href="/portal.html">Back to the portal</a></p>
                </div>
            </div>
        </section>
    </main>

    <div class="cursor-glow" aria-hidden="true"></div>
    <script src="script.js?v=41"></script>
</body>
</html>
